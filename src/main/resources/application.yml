spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: smart-agent
  profiles:
    default: local
  datasource:
    url: ${AGENT_DB_URL:jdbc:mysql://localhost:3306/smart_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${AGENT_DB_USERNAME:root}
    password: ${AGENT_DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${AGENT_REDIS_HOST:localhost}
      port: ${AGENT_REDIS_PORT:6380}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
agent:
  time-zone: ${AGENT_TIME_ZONE:Asia/Shanghai}
  web-search:
    enabled: ${AGENT_WEB_SEARCH_ENABLED:false}
    provider: ${AGENT_WEB_SEARCH_PROVIDER:auto}
    max-results: ${AGENT_WEB_SEARCH_MAX_RESULTS:5}
    timeout: ${AGENT_WEB_SEARCH_TIMEOUT:15s}
  business:
    mode: ${AGENT_BUSINESS_MODE:smart-boot}
    base-url: ${SMART_BOOT_BASE_URL:http://localhost:8888}
  persistence:
    enabled: ${AGENT_PERSISTENCE_ENABLED:true}
  qdrant:
    enabled: ${AGENT_QDRANT_ENABLED:false}
    host: ${AGENT_QDRANT_HOST:localhost}
    grpc-port: ${AGENT_QDRANT_GRPC_PORT:6334}
    api-key: ${AGENT_QDRANT_API_KEY:}
    tls: ${AGENT_QDRANT_TLS:false}
    collection-name: ${AGENT_QDRANT_COLLECTION:agent_knowledge_dev}
    attachment-collection-name: ${AGENT_QDRANT_ATTACHMENT_COLLECTION:agent_conversation_attachment_dev}
    vector-dimension: ${AGENT_QDRANT_VECTOR_DIMENSION:64}
  embedding:
    mode: ${AGENT_EMBEDDING_MODE:local-hash}
  model:
    mode: ${AGENT_MODEL_MODE:local}
    base-url: ${AGENT_MODEL_BASE_URL:http://localhost:11434/v1}
    api-key: ${AGENT_MODEL_API_KEY:local-development-key}
    chat-model: ${AGENT_CHAT_MODEL:local-test-model}
    connect-timeout: ${AGENT_MODEL_CONNECT_TIMEOUT:5s}
    read-timeout: ${AGENT_MODEL_READ_TIMEOUT:30s}
    # 首次启动且数据库尚无任何模型配置时，用以上参数导入一条并设为默认。
    # 已有记录一律不覆盖，重复启动不会重复导入；导入完成后运行期只读取数据库配置。
    bootstrap:
      enabled: ${AGENT_MODEL_BOOTSTRAP_ENABLED:true}
      # 导入模型声明的能力，逗号分隔，可选 TOOL_CALLING/VISION/FILE_INPUT/WEB_SEARCH/STREAMING。
      capabilities: ${AGENT_MODEL_BOOTSTRAP_CAPABILITIES:TOOL_CALLING,STREAMING}
server:
  max-http-request-header-size: ${AGENT_MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
